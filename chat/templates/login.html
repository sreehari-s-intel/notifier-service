<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Log Chat</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #1a1a2e;
            color: #eee;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .login-box {
            background: #16213e;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #0f3460;
            width: 360px;
        }
        .login-box h2 {
            color: #e94560;
            margin-bottom: 8px;
            text-align: center;
        }
        .login-box .subtitle {
            text-align: center;
            color: #888;
            font-size: 0.85rem;
            margin-bottom: 24px;
        }
        .login-box input {
            width: 100%;
            background: #1a1a2e;
            border: 1px solid #0f3460;
            color: #eee;
            padding: 12px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            margin-bottom: 16px;
        }
        .login-box input:focus {
            outline: none;
            border-color: #e94560;
        }
        .login-box button {
            width: 100%;
            background: #e94560;
            border: none;
            color: white;
            padding: 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
        }
        .login-box button:hover { background: #c73e54; }
        .error-msg {
            color: #ff6b6b;
            font-size: 0.85rem;
            margin-bottom: 12px;
            text-align: center;
            display: none;
        }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>Log Chat</h2>
        <p class="subtitle">Enter password to access the log explorer</p>
        <div class="error-msg" id="errorMsg">Invalid password</div>
        <form onsubmit="doLogin(event)">
            <input type="password" id="password" placeholder="Password" autofocus>
            <button type="submit">Login</button>
        </form>
    </div>

    <script>
        async function doLogin(e) {
            e.preventDefault();
            const password = document.getElementById('password').value;
            const errorMsg = document.getElementById('errorMsg');

            const resp = await fetch('/login', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ password }),
            });

            if (resp.ok) {
                window.location.href = '/';
            } else {
                errorMsg.style.display = 'block';
                document.getElementById('password').value = '';
            }
        }
    </script>
</body>
</html>
